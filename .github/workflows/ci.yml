name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Run examples
        env:
          AGENT_REPLAY_DB: ${{ runner.temp }}/traces.db
        run: |
          python examples/minimal_openai_agent/main.py
          python examples/failed_tool_call/main.py
          python examples/bad_retrieval/main.py
          python examples/ignored_tool_result/main.py
          agent-replay list
          agent-replay show latest
          agent-replay export latest --format json > /dev/null
          agent-replay export latest --format otlp > /dev/null
