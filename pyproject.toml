[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-replay"
version = "0.1.0"
description = "Time-travel debugging for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Agent Replay contributors" }]
keywords = [
    "ai",
    "agents",
    "llm",
    "observability",
    "debugging",
    "replay",
    "tracing",
    "opentelemetry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
# Optional: emit through a real OpenTelemetry SDK. Phase 1 export works without it.
otel = ["opentelemetry-sdk>=1.20"]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
agent-replay = "agent_replay.cli.main:main"

[project.urls]
Homepage = "https://github.com/agent-experience/agent-replay"
Repository = "https://github.com/agent-experience/agent-replay"
Issues = "https://github.com/agent-experience/agent-replay/issues"

[tool.hatch.build.targets.wheel]
packages = ["agent_replay"]

[tool.hatch.build.targets.sdist]
include = [
    "/agent_replay",
    "/examples",
    "/docs",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
